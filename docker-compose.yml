version: '3.8'

services:
  web:
    build: .
    ports:
      - "80:80"
    restart: always

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    pid: host

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
         - GF_SECURITY_ADMIN_PASSWORD=admin123
         - GF_SMTP_ENABLED=true
         - GF_SMTP_HOST=smtp.yandex.ru:465
         - GF_SMTP_USER=vv.tsurkan@yandex.ru
         - GF_SMTP_PASSWORD=jgyrmmkucvpnjrwn
         - GF_SMTP_FROM_ADDRESS=vv.tsurkan@yandex.ru
         - GF_SMTP_SKIP_VERIFY=false
    volumes:
      - grafana-data:/var/lib/grafana

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: unless-stopped
    volumes:
      - /var/log:/var/log:ro # Читаем логи хост-машины (только для чтения)
      - /var/lib/docker/containers:/var/lib/docker/containers:ro # Логи Docker-контейнеров
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail-config.yaml:/etc/promtail/config.yaml
    command: -config.file=/etc/promtail/config.yaml

volumes:
  grafana-data:
  loki-data:
